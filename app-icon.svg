<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fd791e"/>
      <stop offset="1" stop-color="#d14a1d"/>
    </linearGradient>
    <clipPath id="dial"><circle cx="256" cy="256" r="176"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <!-- night half of the dial -->
  <circle cx="256" cy="256" r="176" fill="#161a26"/>
  <!-- day half, edged by a gently curved terminator -->
  <path clip-path="url(#dial)" d="M262 80 A176 176 0 0 0 262 432 A22 176 0 0 0 262 80 Z" fill="#f3f0e7"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="#0d1226" stroke-opacity="0.35" stroke-width="4"/>
  <!-- quarter ticks -->
  <g stroke-width="10" stroke-linecap="round">
    <path d="M256 102v24" stroke="#8b8778"/>
    <path d="M256 386v24" stroke="#8b8778"/>
    <path d="M102 256h24" stroke="#8b8778"/>
    <path d="M386 256h24" stroke="#5d6680"/>
  </g>
  <!-- hour hand into daylight (dark ink), minute hand into night (light ink) -->
  <g fill="none" stroke-linecap="round">
    <path d="M256 256L184 196" stroke="#23262f" stroke-width="26"/>
    <path d="M256 256L350 182" stroke="#e8ebf3" stroke-width="20"/>
    <path d="M256 256L204 334" stroke="#ff5f57" stroke-width="9"/>
  </g>
  <circle cx="256" cy="256" r="18" fill="#fd791e"/>
  <circle cx="256" cy="256" r="7" fill="#f3f0e7"/>
</svg>
